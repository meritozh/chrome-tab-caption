<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Caption — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="opt-redirect">
    <main class="opt-redirect-card">
      <p class="opt-eyebrow">chrome-tab-caption</p>
      <h1>Settings live in the Side Panel</h1>
      <p class="opt-lede">
        LLM, thresholds, and privacy are edited under <strong>Side Panel → Settings</strong>.
        This page only opens that view (Chrome still requires an Options entry point).
      </p>
      <div class="opt-actions">
        <button type="button" id="btn-open-settings" class="opt-primary">
          Open Side Panel Settings
        </button>
        <span id="redirect-status" class="opt-status" role="status"></span>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
